<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Core Neon Glow Gradient -->
    <linearGradient id="voltGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9FF66"/>
      <stop offset="50%" stop-color="#D2F827"/>
      <stop offset="100%" stop-color="#95C407"/>
    </linearGradient>

    <!-- Deep Metallic Chassis Gradient -->
    <linearGradient id="stealthPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14141C"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#D2F827"/>
    </linearGradient>

    <!-- Gaussian Hologram Filter -->
    <filter id="neonAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Stealth Polygonal Shield Base Plate -->
  <path d="M256 18 L466 102 V326 L256 494 L46 326 V102 Z" fill="url(#stealthPlate)" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <path d="M256 36 L446 114 V314 L256 468 L66 314 V114 Z" stroke="#D2F827" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6"/>

  <!-- 2. Cyber Technical Reticles -->
  <circle cx="256" cy="256" r="160" stroke="rgba(210,248,39,0.08)" stroke-width="1.5"/>
  <line x1="256" y1="50" x2="256" y2="76" stroke="#D2F827" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="436" x2="256" y2="462" stroke="#D2F827" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="256" x2="106" y2="256" stroke="#D2F827" stroke-width="3" stroke-linecap="round"/>
  <line x1="406" y1="256" x2="432" y2="256" stroke="#D2F827" stroke-width="3" stroke-linecap="round"/>

  <!-- 3. Kinetic Central Hex Aura -->
  <circle cx="256" cy="256" r="90" fill="#D2F827" fill-opacity="0.05" filter="url(#neonAura)"/>

  <!-- 4. Precision Faceted 'V' Iconography -->
  <!-- Left Wing -->
  <path d="M128 142 L206 142 L256 308 L220 308 Z" fill="#E4E4E7"/>
  <!-- Right Wing -->
  <path d="M384 142 L306 142 L256 308 L292 308 Z" fill="#71717A"/>
  
  <!-- Cyber Cut Lightning Core -->
  <path d="M214 174 L324 174 L256 388 Z" fill="url(#voltGlow)" filter="url(#neonAura)"/>
  <polygon points="256,192 238,272 264,272 248,348 284,260 256,260" fill="#060608"/>

  <!-- 5. Bottom Energy Vector Indicator -->
  <circle cx="256" cy="418" r="4" fill="#D2F827"/>
</svg>
